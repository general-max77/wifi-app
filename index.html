<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>باقتي</title>
<style>
  :root{--g:#0b6e4f;--bg:#f2f5f4;--card:#fff;--tx:#17211d;--mut:#6b7a74}
  *{box-sizing:border-box;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
  body{margin:0;background:var(--bg);color:var(--tx)}
  header{background:var(--g);color:#fff;padding:18px;text-align:center;font-size:20px;font-weight:700}
  main{max-width:480px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
  input{width:100%;padding:12px;border:1px solid #cfd8d4;border-radius:10px;font-size:16px}
  button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:17px;font-weight:700}
  button.sec{background:#e4ece8;color:var(--g)}
  .big{font-size:42px;font-weight:800;color:var(--g);text-align:center}
  .sub{text-align:center;color:var(--mut)}
  .bar{height:14px;background:#e1e8e5;border-radius:8px;overflow:hidden;margin:12px 0}
  .bar>div{height:100%;background:var(--g);transition:width .6s}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f0}
  .row:last-child{border:0}
  .note{font-size:13px;color:var(--mut);text-align:center;margin-top:8px}
  .hide{display:none}
  #msg{color:#b3261e;text-align:center;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<header>باقتي</header>
<main>

  <section id="login" class="card">
    <label>اسم المستخدم</label>
    <input id="u" autocomplete="username" placeholder="مثال: demo">
    <label>كلمة السر</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="مثال: 1234">
    <button onclick="doLogin()">دخول</button>
    <div id="msg"></div>
    <div class="note">نسخة تجريبية: ادخل بـ demo و 1234</div>
  </section>

  <section id="home" class="hide">
    <div class="card">
      <div class="sub">المتبقي من الباقة</div>
      <div class="big"><span id="left">0</span> جيجا</div>
      <div class="bar"><div id="fill"></div></div>
      <div class="sub">من إجمالي <span id="total">0</span> جيجا</div>
    </div>
    <div class="card">
      <div class="row"><span>اسم المشترك</span><b id="name"></b></div>
      <div class="row"><span>الباقة</span><b id="plan"></b></div>
      <div class="row"><span>تاريخ الانتهاء</span><b id="exp"></b></div>
      <div class="row"><span>الأيام المتبقية</span><b id="days"></b></div>
    </div>
    <button onclick="renew()">تجديد الاشتراك (محفظة كاش)</button>
    <button class="sec" onclick="logout()">خروج</button>
    <div class="note">البيانات الحالية تجريبية، هنربطها بالشبكة الحقيقية بعدين</div>
  </section>

</main>
<script>
  // بيانات تجريبية (هتتبدل ببيانات الشبكة الحقيقية بعدين)
  var USERS = {
    demo: {pass:"1234", name:"مشترك تجريبي", plan:"باقة 100 جيجا", total:100, used:37, exp:"2026-11-15"}
  };
  function $(id){return document.getElementById(id)}
  function show(id){["login","home"].forEach(function(s){$(s).classList.toggle("hide", s!==id)})}
  function doLogin(){
    var u=$("u").value.trim().toLowerCase(), p=$("p").value;
    var d=USERS[u];
    if(!d||d.pass!==p){$("msg").textContent="اسم المستخدم أو كلمة السر غلط";return}
    $("msg").textContent="";
    try{localStorage.setItem("user",u)}catch(e){}
    render(u);
  }
  function render(u){
    var d=USERS[u]; if(!d){show("login");return}
    var left=(d.total-d.used).toFixed(1);
    $("left").textContent=left;
    $("total").textContent=d.total;
    $("fill").style.width=Math.max(0,(left/d.total*100))+"%";
    $("name").textContent=d.name;
    $("plan").textContent=d.plan;
    $("exp").textContent=d.exp;
    var days=Math.ceil((new Date(d.exp)-new Date())/86400000);
    $("days").textContent=days>0?days+" يوم":"منتهي";
    show("home");
  }
  function renew(){alert("التجديد عن طريق محفظة كاش هيتضاف في الخطوة الجاية")}
  function logout(){try{localStorage.removeItem("user")}catch(e){} show("login")}
  try{var s=localStorage.getItem("user"); if(s) render(s)}catch(e){}
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
